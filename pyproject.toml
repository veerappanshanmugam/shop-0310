[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shop-0310"
version = "1.0.0"
description = "E-commerce monolith backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "sqlmodel==0.0.38",
    "python-multipart==0.0.32",
    "aiosqlite==0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce"]
